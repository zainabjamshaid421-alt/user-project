<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Form</title>
</head>
<body>
    <h2>Users Form</h2>
    <form action="/submit" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <input type="submit" value="Submit">
        </form>
        <h3>Alphabet Typing Keyboard</h3>
        <div id="keyboard">
            <!-- Keyboard keys will be generated by JavaScript -->
        </div>
        <br>
        <button class="space-button" onclick="typeLetter(' ')">Space</button>
        <button class="space-button" onclick="clearName()">clear</button>
        <script>
            const keyboardContainer = document.getElementById('keyboard');
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

            // Generate keyboard keys
            for (let letter of letters) {
                const button = document.createElement('button');
                button.textContent = letter;
                button.onclick = () => typeLetter(letter);
                keyboardContainer.appendChild(button);
            }

            function typeLetter(letter) {
                const nameInput = document.getElementById('name');
                nameInput.value += letter;
            }

            function clearName() {
                const nameInput = document.getElementById('name');
                nameInput.value = '';
            }
        </script>
    </body>
</html>
